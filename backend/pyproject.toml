[project]
name = "localpulse-backend"
version = "0.1.0"
description = "LocalPulse FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "email-validator>=2.0.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.28.0",
  "Pillow>=11.0.0",
  "python-multipart>=0.0.20",
  "aiofiles>=24.1.0",
  "structlog>=25.1.0",
  "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
